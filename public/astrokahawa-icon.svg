<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="icon-bean-grad" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="icon-emerald-grad" x1="75" y1="75" x2="425" y2="425" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="icon-orbit-grad" x1="50" y1="450" x2="450" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0C1310" />

  <g transform="translate(20, 20) scale(4.72)">
    <!-- Orbital trajectory -->
    <path d="M 16 76 C 8 50, 24 18, 56 12 C 78 8, 92 24, 88 44 C 85 58, 72 74, 52 82 C 38 88, 22 84, 16 76" fill="none" stroke="url(#icon-orbit-grad)" stroke-width="3.5" stroke-linecap="round" />

    <!-- Left bean lobe with geolocation contour -->
    <path d="M 48 20 C 32 20, 22 34, 23 50 C 24 64, 34 76, 48 80 C 47 70, 43 58, 38 48 C 34 40, 36 30, 48 20 Z" fill="url(#icon-bean-grad)" />

    <!-- Right bean lobe with export trajectory -->
    <path d="M 52 20 C 64 20, 77 32, 77 48 C 77 64, 66 78, 52 80 C 53 70, 57 58, 62 48 C 66 40, 64 30, 52 20 Z" fill="url(#icon-emerald-grad)" />

    <!-- Crease meridian -->
    <path d="M 50 19 Q 36 48 50 50 Q 64 52 50 81" fill="none" stroke="#0C1310" stroke-width="4" stroke-linecap="round" />

    <!-- Origin GPS point -->
    <circle cx="50" cy="50" r="4.5" fill="#F59E0B" stroke="#0C1310" stroke-width="2" />

    <!-- Orbital node -->
    <circle cx="84" cy="28" r="4.5" fill="#34D399" />
  </g>
</svg>
